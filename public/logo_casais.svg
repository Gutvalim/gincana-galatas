<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="casaisBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#581c87"/>
      <stop offset="50%" stop-color="#3b0764"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="ringGold1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="ringGold2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="60%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>
    <filter id="dropGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Outer Ring Badge -->
  <circle cx="200" cy="200" r="190" fill="url(#casaisBg)" stroke="url(#goldBorder)" stroke-width="8" filter="url(#dropGlow)"/>
  <circle cx="200" cy="200" r="175" fill="none" stroke="#fef08a" stroke-width="2" stroke-dasharray="8,5" opacity="0.8"/>
  <circle cx="200" cy="200" r="132" fill="#2e1065" stroke="url(#goldBorder)" stroke-width="4"/>

  <!-- Text Paths for Circular Typography -->
  <path id="topTextArc" d="M 52,200 A 148,148 0 0,1 348,200" fill="none"/>
  <path id="bottomTextArc" d="M 348,200 A 148,148 0 0,1 52,200" fill="none"/>

  <text fill="#fef08a" font-family="'Poppins', 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="900" letter-spacing="3.5">
    <textPath href="#topTextArc" startOffset="50%" text-anchor="middle">
      SOCIEDADE DE CASAIS
    </textPath>
  </text>

  <text fill="#fbbf24" font-family="'Poppins', 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="800" letter-spacing="4.5">
    <textPath href="#bottomTextArc" startOffset="50%" text-anchor="middle">
      IPBNB • FAMÍLIA EM CRISTO
    </textPath>
  </text>

  <!-- Side Decorative Stars -->
  <g fill="#f59e0b">
    <polygon points="46,200 48,194 54,194 49,190 51,184 46,188 41,184 43,190 38,194 44,194" transform="scale(1.2) translate(-7,-35)"/>
    <polygon points="354,200 356,194 362,194 357,190 359,184 354,188 349,184 351,190 346,194 352,194" transform="scale(1.2) translate(-50,-35)"/>
  </g>

  <!-- Center Artwork -->
  <g filter="url(#dropGlow)">
    <!-- Latin Cross on Top -->
    <path d="M 197 105 h 6 v 32 h -6 z" fill="url(#goldBorder)"/>
    <path d="M 188 114 h 24 v 6 h -24 z" fill="url(#goldBorder)"/>

    <!-- Subtle Heart Halo -->
    <path d="M 200 155 C 185 130, 145 140, 152 175 C 158 200, 185 220, 200 234 C 215 220, 242 200, 248 175 C 255 140, 215 130, 200 155 Z" fill="#ec4899" fill-opacity="0.25" stroke="#f472b6" stroke-width="2"/>

    <!-- Left Wedding Ring -->
    <circle cx="178" cy="188" r="32" fill="none" stroke="url(#ringGold1)" stroke-width="11"/>
    <!-- Right Wedding Ring -->
    <circle cx="222" cy="188" r="32" fill="none" stroke="url(#ringGold2)" stroke-width="11"/>
    <!-- Interlock Overlap -->
    <path d="M 174 156 A 32 32 0 0 1 210 188" fill="none" stroke="url(#ringGold1)" stroke-width="11"/>

    <!-- Open Holy Bible at Bottom of Rings -->
    <g transform="translate(0, 15)">
      <!-- Bible pages left & right -->
      <path d="M 152 225 Q 176 220 200 230 Q 224 220 248 225 L 248 245 Q 224 240 200 250 Q 176 240 152 245 Z" fill="#fef9c3" stroke="#b45309" stroke-width="2.5"/>
      <path d="M 200 230 L 200 250" stroke="#b45309" stroke-width="2.5"/>
      <line x1="162" y1="231" x2="190" y2="233" stroke="#b45309" stroke-width="1.5" stroke-dasharray="3,2"/>
      <line x1="162" y1="237" x2="190" y2="239" stroke="#b45309" stroke-width="1.5" stroke-dasharray="3,2"/>
      <line x1="210" y1="233" x2="238" y2="231" stroke="#b45309" stroke-width="1.5" stroke-dasharray="3,2"/>
      <line x1="210" y1="239" x2="238" y2="237" stroke="#b45309" stroke-width="1.5" stroke-dasharray="3,2"/>
      <!-- Ribbon Bookmark -->
      <path d="M 200 250 L 196 264 L 200 261 L 204 264 Z" fill="#dc2626"/>
    </g>
  </g>
</svg>
