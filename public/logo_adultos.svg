<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="adultosBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#06140e"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="goldAdultos" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="treeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#006341"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>
    <filter id="shadowAdultos" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Outer Ring Badge -->
  <circle cx="200" cy="200" r="190" fill="url(#adultosBg)" stroke="url(#goldAdultos)" stroke-width="8" filter="url(#shadowAdultos)"/>
  <circle cx="200" cy="200" r="175" fill="none" stroke="#fde047" stroke-width="2" stroke-dasharray="8,5" opacity="0.8"/>
  <circle cx="200" cy="200" r="132" fill="#042f2e" stroke="url(#goldAdultos)" stroke-width="4"/>

  <!-- Text Paths for Circular Typography -->
  <path id="adultosTopArc" d="M 52,200 A 148,148 0 0,1 348,200" fill="none"/>
  <path id="adultosBottomArc" d="M 348,200 A 148,148 0 0,1 52,200" fill="none"/>

  <text fill="#fef08a" font-family="'Poppins', 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="900" letter-spacing="3">
    <textPath href="#adultosTopArc" startOffset="50%" text-anchor="middle">
      MINISTÉRIO DE ADULTOS
    </textPath>
  </text>

  <text fill="#fbbf24" font-family="'Poppins', 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="800" letter-spacing="4">
    <textPath href="#adultosBottomArc" startOffset="50%" text-anchor="middle">
      IPBNB • FÉ E MATURIDADE
    </textPath>
  </text>

  <!-- Side Decorative Cross Emblems -->
  <g fill="#f59e0b">
    <polygon points="46,200 48,194 54,194 49,190 51,184 46,188 41,184 43,190 38,194 44,194" transform="scale(1.2) translate(-7,-35)"/>
    <polygon points="354,200 356,194 362,194 357,190 359,184 354,188 349,184 351,190 346,194 352,194" transform="scale(1.2) translate(-50,-35)"/>
  </g>

  <!-- Center Artwork: The Presbyterian Burning Bush & The Word -->
  <g filter="url(#shadowAdultos)">
    <!-- Latin Cross at center top crown -->
    <path d="M 197 96 h 6 v 28 h -6 z" fill="url(#goldAdultos)"/>
    <path d="M 189 104 h 22 v 5 h -22 z" fill="url(#goldAdultos)"/>

    <!-- Presbyterian Burning Bush (Sarça Ardente) -->
    <!-- Bush Silhouette -->
    <path d="M 175 195 C 150 190, 140 160, 160 145 C 145 130, 170 115, 190 125 C 205 110, 230 115, 235 130 C 255 130, 260 160, 245 175 C 260 190, 240 210, 220 205 C 215 215, 185 215, 175 195 Z" fill="url(#treeGrad)" stroke="#065f46" stroke-width="2"/>

    <!-- Central Holy Flame (Chama Sagrada) -->
    <path d="M 200 135 Q 212 155 204 175 Q 220 160 215 145 Q 228 170 210 190 Q 200 198 190 190 Q 172 170 185 145 Q 180 160 196 175 Q 188 155 200 135 Z" fill="url(#flameGrad)"/>

    <!-- Trunk and Roots -->
    <path d="M 196 195 L 194 218 L 206 218 L 204 195 Z" fill="#78350f"/>
    <path d="M 194 218 Q 180 224 172 226 L 175 228 Q 185 226 195 222 Z" fill="#78350f"/>
    <path d="M 206 218 Q 220 224 228 226 L 225 228 Q 215 226 205 222 Z" fill="#78350f"/>

    <!-- Open Holy Bible Base -->
    <g transform="translate(0, 10)">
      <path d="M 150 225 Q 175 218 200 228 Q 225 218 250 225 L 250 250 Q 225 243 200 255 Q 175 243 150 250 Z" fill="#fef9c3" stroke="#b45309" stroke-width="2.5"/>
      <path d="M 200 228 L 200 255" stroke="#b45309" stroke-width="2.5"/>
      <!-- Scripture line marks -->
      <line x1="160" y1="233" x2="190" y2="235" stroke="#006341" stroke-width="1.8" stroke-dasharray="3,2"/>
      <line x1="160" y1="240" x2="190" y2="242" stroke="#006341" stroke-width="1.8" stroke-dasharray="3,2"/>
      <line x1="210" y1="235" x2="240" y2="233" stroke="#006341" stroke-width="1.8" stroke-dasharray="3,2"/>
      <line x1="210" y1="242" x2="240" y2="240" stroke="#006341" stroke-width="1.8" stroke-dasharray="3,2"/>
      <!-- Golden ribbon bookmark -->
      <path d="M 200 255 L 196 270 L 200 267 L 204 270 Z" fill="#f59e0b"/>
    </g>
  </g>
</svg>
